name: Update data

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          coverage: none

      # Exits non-zero without touching data/ if a download fails or a list shrinks by more than half.
      - name: Refresh the snapshot
        run: node scripts/update-data.mjs

      - name: Show changes
        run: git diff --stat -- data

      # Pushes made with GITHUB_TOKEN do not trigger ci.yml, so the suites run here.
      - name: Test
        run: |
          node --test
          php php/tests/run.php

      - name: Commit if the data changed
        run: |
          if git diff --quiet -- data && [ -z "$(git ls-files --others --exclude-standard -- data)" ]; then
            echo "Upstream data unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m "Update data ($(date -u +%Y-%m-%d))"
          git push

  # GitHub disables scheduled workflows after 60 days without repository activity.
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/update-data.yml/enable"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
